[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webauthn-assess"
version = "0.1.0"
description = "Compact WebAuthn assessment tool using Chromium virtual authenticators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "playwright>=1.43.0",
  "fido2>=1.1.3",
  "cryptography>=42.0.0",
]

[project.scripts]
webauthn-assess = "webauthn_assess.cli:main"

[tool.setuptools]
packages = ["webauthn_assess"]
